name: nightly
# 每夜 V5 有效性：变异测试（L2 柱二层4）。出报告，不阻断。
# 不阻断是刻意的：变异得分有噪声，让它阻断最后一定被加跳过开关。正确做法是趋势告警，连续三天破线才登记。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}  # 手动触发（验证用）
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: 装 spec-runner + mutmut + hypothesis
        run: python -m pip install -e "tools/spec-runner[test]" hypothesis mutmut
      - name: 变异测试（L2 柱二层4，不阻断，出报告）
        run: |
          mutmut run || true
          echo "=== 变异结果 ==="
          mutmut results || true
      - name: 确定性探索（L2 柱三，hypothesis 长探索）
        env:
          HYPOTHESIS_MAX_EXAMPLES: "1000"  # CI 默认 100，nightly 探索 1000 抓白天漏的
        run: |
          python -m pytest tests/ tools/spec-runner/tests/ -q --hypothesis-show-statistics || true
      - name: verify-ai（L2 概率性裁决，柱二层5/6，有 KEY 才跑，不阻断）
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: |
          if [ -z "$ZHIPUAI_API_KEY" ]; then echo "无 KEY，跳过"; exit 0; fi
          for s in specs/*.spec.md; do
            echo "::group::verify-ai $s"
            python -m spec_runner verify-ai "$s" || true  # 概率性不阻断，出 concerns 报告
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mutation-report, path: mutants/}
