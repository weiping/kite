name: verify
# L1 地基验证：需求治理 → 计划 DAG → 契约执行（spec-runner bridge 注入 agent-spec）→ 五态门禁
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      risk-level: ${{ steps.risk.outputs.level }}
    steps:
      # 注意：生产环境应把下列 action 锁到提交 SHA，不锁标签（标签可被重新指向）
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.4'}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 装 opa（rego 策略评估，L1.5 风险分级）
        uses: open-policy-agent/setup-opa@v2
        with: {version: latest}

      - name: 装 agent-spec（意图编译器，Rust）
        run: cargo install agent-spec --quiet

      - name: 装 spec-runner + hypothesis + semgrep
        run: |
          python -m pip install -e "tools/spec-runner[test]" hypothesis
          # semgrep 用于 INV-003 静态不变量；装失败则该契约判 uncertain
          python -m pip install semgrep || echo "::warning::semgrep 未装，INV-003 将判 uncertain"

      # 设计系统门禁：DESIGN.md 结构/对比度（包名按上游核对）
      - name: lint DESIGN.md
        run: npx -y @google/design.md lint docs/ixd/DESIGN.md

      # V0 规约层：需求治理门禁（0 error 才过）
      - name: lint knowledge corpus
        run: agent-spec lint-knowledge --knowledge knowledge --gate

      # 计划 DAG：所有 ready REQ 必须有 satisfying spec（0 diagnostic 才过）
      - name: requirements plan gate
        run: agent-spec requirements plan --gate

      # Flutter 依赖（dart 场景需要）
      - name: flutter pub get
        run: cd apps/mobile && flutter pub get

      # 契约执行：spec-runner 跑测试 → 注入 agent-spec resolve-ai（把 skip 变真实 verdict）
      - name: bridge 各契约
        run: |
          for s in task-sync-conflict task-cap-voice task-struct-classify task-ret-search task-store task-proto-poison task-notify-isolation task-inv-003-pure-function; do
            echo "::group::bridge $s"
            python -m spec_runner bridge specs/$s.spec.md
          done

      # 五态门禁：跳过永远阻断
      - name: spec-runner run + gate
        run: |
          python -m spec_runner run specs/ --out .out
          python -m spec_runner gate .out/evidence.json --level L1

      # L1.5 风险分级门禁：deny（悬空选择器/边界越界）阻断；输出 level 供 auto-merge
      - name: risk gate（L1.5 风险分级）
        id: risk
        run: |
          python -c "from spec_runner.risk import collect_risk_input; d=collect_risk_input(); print('DIAG changed_files=', d['changed_files']); print('DIAG boundary_violations=', d['boundary_violations'])"
          python -m spec_runner risk > .out/risk.json 2>&1 || true
          echo "=== risk.json ==="
          cat .out/risk.json
          echo "level=$(python -c 'import json; print(json.load(open(".out/risk.json")).get("level",""))' 2>/dev/null || echo "")" >> $GITHUB_OUTPUT
          python -c "import json,sys; d=json.load(open('.out/risk.json')); sys.exit(1 if d.get('deny') else 0)"

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: evidence, path: .out/}

  auto-merge:
    needs: contract
    if: github.event_name == 'pull_request' && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: R0 自动合并
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LEVEL: ${{ needs.contract.outputs.risk-level }}
        run: |
          echo "risk level: $LEVEL"
          if [ "$LEVEL" = "R0" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
            echo "R0 → 自动合并（squash）"
          else
            gh pr edit "$PR_NUMBER" --add-label "needs-review"
            echo "非 R0 → 标 needs-review，等人审"
          fi
