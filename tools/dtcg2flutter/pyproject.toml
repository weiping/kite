[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtcg2flutter"
version = "0.1.0"
description = "把 W3C DTCG 设计令牌 JSON 编译成 Flutter 主题 Dart 代码"
requires-python = ">=3.11"

[project.scripts]
dtcg2flutter = "dtcg2flutter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtcg2flutter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
