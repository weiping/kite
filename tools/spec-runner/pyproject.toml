[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-runner"
version = "0.1.0"
description = "agent-spec 执行器适配与五态门禁（Kite L1 地基）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "zhipuai>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
spec-runner = "spec_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spec_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
